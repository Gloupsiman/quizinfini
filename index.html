<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizInfini — Culture Générale</title>
  <meta name="description" content="Quiz de culture générale infini — Histoire, Science, Cinéma, Sport et plus encore. Gratuit, sans pub, jouable partout." />
  <meta name="theme-color" content="#185FA5" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="QuizInfini" />
  <!-- Open Graph pour partage -->
  <meta property="og:title" content="QuizInfini — Teste ta culture générale !" />
  <meta property="og:description" content="Quiz gratuit, 7 thèmes, chrono 20s. Peux-tu faire mieux que moi ?" />
  <meta property="og:type" content="website" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #185FA5;
      --blue-dark: #0C447C;
      --blue-light: #E6F1FB;
      --blue-text: #0C447C;
      --green-bg: #EAF3DE;
      --green-text: #27500A;
      --red-bg: #FCEBEB;
      --red-text: #791F1F;
      --amber-bg: #FAEEDA;
      --amber-text: #633806;
      --gray: #F1EFE8;
      --text: #1a1a1a;
      --text-muted: #666;
      --border: #e0e0e0;
      --bg: #f7f7f5;
      --card: #ffffff;
      --radius: 12px;
      --radius-sm: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f0f0f0;
        --text-muted: #aaa;
        --border: #333;
        --bg: #111;
        --card: #1e1e1e;
        --gray: #2a2a2a;
        --blue-light: #0c2a4a;
        --blue-text: #85B7EB;
        --green-bg: #1a2e0a;
        --green-text: #C0DD97;
        --red-bg: #2e0a0a;
        --red-text: #F09595;
        --amber-bg: #2e1e00;
        --amber-text: #FAC775;
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .app { max-width: 480px; margin: 0 auto; padding: 16px; }

    /* Header */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-top: 8px; }
    .logo-row { display: flex; align-items: center; gap: 10px; }
    .logo { width: 38px; height: 38px; background: var(--blue); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .app-name { font-size: 20px; font-weight: 700; color: var(--text); }
    .stats-bar { display: flex; gap: 14px; }
    .stat { text-align: center; }
    .stat-n { font-size: 20px; font-weight: 700; color: var(--text); }
    .stat-l { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }

    /* Themes */
    .theme-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
    .theme-scroll::-webkit-scrollbar { display: none; }
    .theme-btn { flex-shrink: 0; font-size: 13px; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all .15s; }
    .theme-btn.active { background: var(--blue); color: white; border-color: var(--blue); font-weight: 600; }

    /* Progress */
    .progress-wrap { margin-bottom: 16px; }
    .progress-bar { height: 5px; background: var(--gray); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--blue); border-radius: 3px; transition: width .4s ease; }
    .progress-text { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

    /* Card */
    .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; margin-bottom: 12px; }
    .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .q-num { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .q-theme-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--blue-light); color: var(--blue-text); font-weight: 600; }
    .q-text { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.45; margin-bottom: 16px; }

    /* Timer */
    .timer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .timer-bar { flex: 1; height: 7px; background: var(--gray); border-radius: 4px; overflow: hidden; }
    .timer-fill { height: 100%; border-radius: 4px; transition: width .1s linear, background .3s; }
    .timer-num { font-size: 14px; font-weight: 700; color: var(--text); min-width: 26px; text-align: right; }

    /* Answers */
    .answers { display: flex; flex-direction: column; gap: 9px; }
    .ans-btn { padding: 13px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; cursor: pointer; text-align: left; line-height: 1.35; transition: all .15s; font-family: inherit; }
    .ans-btn:active { transform: scale(.98); }
    .ans-btn:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-light); color: var(--blue-text); }
    .ans-btn.correct { background: var(--green-bg); border-color: #3B6D11; color: var(--green-text); font-weight: 600; }
    .ans-btn.wrong { background: var(--red-bg); border-color: #A32D2D; color: var(--red-text); }
    .ans-btn.reveal { background: var(--green-bg); border-color: #3B6D11; color: var(--green-text); }
    .ans-btn:disabled { cursor: not-allowed; }

    /* Feedback */
    .feedback { margin-top: 12px; padding: 11px 14px; border-radius: var(--radius-sm); font-size: 14px; line-height: 1.5; display: none; }
    .feedback.ok { background: var(--green-bg); color: var(--green-text); }
    .feedback.ko { background: var(--red-bg); color: var(--red-text); }

    /* Next btn */
    .next-btn { margin-top: 12px; width: 100%; padding: 14px; border-radius: var(--radius-sm); border: none; background: var(--blue); color: white; font-size: 15px; font-weight: 700; cursor: pointer; display: none; font-family: inherit; transition: background .15s; }
    .next-btn:hover { background: var(--blue-dark); }

    /* End screen */
    .end-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 32px 20px; text-align: center; display: none; }
    .end-trophy { font-size: 52px; margin-bottom: 8px; }
    .end-score { font-size: 52px; font-weight: 800; color: var(--blue); margin-bottom: 4px; }
    .end-label { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; }
    .end-msg { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .end-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
    .end-btns { display: flex; flex-direction: column; gap: 10px; }
    .btn-primary { background: var(--blue); color: white; border: none; border-radius: var(--radius-sm); padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .15s; }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-sec { background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px; font-size: 15px; color: var(--text); cursor: pointer; font-family: inherit; }
    .btn-sec:hover { background: var(--gray); }

    /* Install banner */
    .install-banner { background: var(--blue-light); border: 1px solid var(--blue); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 16px; display: none; }
    .install-banner p { font-size: 13px; color: var(--blue-text); margin-bottom: 8px; font-weight: 500; }
    .install-banner button { background: var(--blue); color: white; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }

    /* Streak */
    .streak-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--amber-bg); color: var(--amber-text); padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 100; border: 1px solid #EF9F27; }
    .streak-toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="streak-toast" id="streakToast"></div>
<div class="app">
  <div class="install-banner" id="installBanner">
    <p>📲 Installe QuizInfini sur ton téléphone pour jouer hors ligne !</p>
    <button onclick="installApp()">Installer l'app</button>
  </div>

  <div class="header">
    <div class="logo-row">
      <div class="logo">🧠</div>
      <div class="app-name">QuizInfini</div>
    </div>
    <div class="stats-bar">
      <div class="stat"><div class="stat-n" id="scoreDisp">0</div><div class="stat-l">Score</div></div>
      <div class="stat"><div class="stat-n" id="streakDisp">0</div><div class="stat-l">Série</div></div>
      <div class="stat"><div class="stat-n" id="totalDisp">0</div><div class="stat-l">Joués</div></div>
    </div>
  </div>

  <div class="theme-scroll" id="themeBar"></div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">Question 1 sur 10</div>
  </div>

  <div class="card" id="questionCard">
    <div class="q-meta">
      <span class="q-num" id="qNum">1 / 10</span>
      <span class="q-theme-badge" id="qTheme">Culture générale</span>
    </div>
    <div class="q-text" id="qText">Chargement...</div>
    <div class="timer-row">
      <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%;background:#185FA5;"></div></div>
      <div class="timer-num" id="timerNum">20</div>
    </div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Suivant →</button>
  </div>

  <div class="end-card" id="endCard">
    <div class="end-trophy">🏆</div>
    <div class="end-score" id="endScore">0/10</div>
    <div class="end-label">bonnes réponses</div>
    <div class="end-msg" id="endMsg"></div>
    <div class="end-sub" id="endSub"></div>
    <div class="end-btns">
      <button class="btn-primary" onclick="restartQuiz()">🔄 Rejouer</button>
      <button class="btn-sec" onclick="shareScore()">📤 Partager mon score</button>
    </div>
  </div>
</div>

<script>
const THEMES = ['Tout','Histoire','Sciences','Géographie','Cinéma','Sport','Art & Culture','Gastronomie'];
const ALL_Q = [
  {q:"Quel est le pays le plus grand du monde par superficie ?",a:["Russie","Canada","Chine","États-Unis"],c:0,t:"Géographie",f:"La Russie couvre 17,1 millions de km²."},
  {q:"En quelle année a eu lieu la Révolution française ?",a:["1789","1776","1804","1815"],c:0,t:"Histoire",f:"La prise de la Bastille eut lieu le 14 juillet 1789."},
  {q:"Combien d'os compte le corps humain adulte ?",a:["206","212","196","220"],c:0,t:"Sciences",f:"Le squelette adulte comprend exactement 206 os."},
  {q:"Quelle planète est surnommée la planète rouge ?",a:["Mars","Jupiter","Saturne","Vénus"],c:0,t:"Sciences",f:"Mars doit sa couleur à l'oxyde de fer présent sur sa surface."},
  {q:"Quel film a remporté l'Oscar du meilleur film en 2024 ?",a:["Oppenheimer","Pauvres créatures","The Zone of Interest","Barbie"],c:0,t:"Cinéma",f:"Oppenheimer de Christopher Nolan a raflé 7 Oscars en 2024."},
  {q:"Dans quel pays se trouve le Machu Picchu ?",a:["Pérou","Bolivie","Équateur","Colombie"],c:0,t:"Géographie",f:"Le Machu Picchu est situé dans les Andes péruviennes."},
  {q:"Qui a peint la Joconde ?",a:["Léonard de Vinci","Michel-Ange","Raphaël","Botticelli"],c:0,t:"Art & Culture",f:"Léonard de Vinci l'a peinte entre 1503 et 1519."},
  {q:"Quelle est la capitale de l'Australie ?",a:["Canberra","Sydney","Melbourne","Brisbane"],c:0,t:"Géographie",f:"Canberra est la capitale depuis 1913."},
  {q:"Combien de joueurs composent une équipe de football sur le terrain ?",a:["11","10","12","9"],c:0,t:"Sport",f:"Chaque équipe aligne 11 joueurs, dont le gardien."},
  {q:"Quel est le plat emblématique du Japon ?",a:["Sushi","Ramen","Tempura","Tonkatsu"],c:0,t:"Gastronomie",f:"Le sushi est l'emblème culinaire du Japon dans le monde entier."},
  {q:"Quel scientifique a formulé la théorie de la relativité ?",a:["Albert Einstein","Isaac Newton","Niels Bohr","Max Planck"],c:0,t:"Sciences",f:"Einstein publia la relativité restreinte en 1905."},
  {q:"En quelle année Neil Armstrong a-t-il marché sur la Lune ?",a:["1969","1967","1971","1965"],c:0,t:"Histoire",f:"Le 21 juillet 1969, lors de la mission Apollo 11."},
  {q:"Quel est le fleuve le plus long du monde ?",a:["Nil","Amazone","Mississippi","Yangtsé"],c:0,t:"Géographie",f:"Le Nil mesure environ 6 650 km."},
  {q:"Qui a écrit Les Misérables ?",a:["Victor Hugo","Émile Zola","Gustave Flaubert","Balzac"],c:0,t:"Art & Culture",f:"Victor Hugo a publié ce chef-d'œuvre en 1862."},
  {q:"Quel est le métal le plus précieux au monde ?",a:["Rhodium","Or","Platine","Palladium"],c:0,t:"Sciences",f:"Le rhodium est le métal le plus cher, utilisé dans les pots catalytiques."},
  {q:"Dans quel sport utilise-t-on un volant ?",a:["Badminton","Tennis","Squash","Paddle"],c:0,t:"Sport",f:"Le volant, ou shuttlecock, est propre au badminton."},
  {q:"Quelle est la monnaie du Japon ?",a:["Yen","Won","Yuan","Baht"],c:0,t:"Géographie",f:"Le yen est la monnaie officielle japonaise depuis 1871."},
  {q:"Quel ingrédient est indispensable dans un vrai guacamole ?",a:["Avocat","Tomate","Coriandre","Oignon"],c:0,t:"Gastronomie",f:"L'avocat est la base du guacamole, originaire du Mexique."},
  {q:"Combien de continents y a-t-il sur Terre ?",a:["7","6","5","8"],c:0,t:"Géographie",f:"Les 7 continents : Afrique, Antarctique, Asie, Europe, Amériques, Océanie."},
  {q:"Quel réalisateur a tourné Titanic et Avatar ?",a:["James Cameron","Steven Spielberg","Christopher Nolan","Roland Emmerich"],c:0,t:"Cinéma",f:"James Cameron a réalisé ces deux blockbusters record."},
  {q:"Quelle ville accueillera les Jeux olympiques d'été en 2028 ?",a:["Los Angeles","Brisbane","Paris","Chicago"],c:0,t:"Sport",f:"Los Angeles accueillera les JO pour la 3e fois."},
  {q:"Qui est l'auteur de Harry Potter ?",a:["J.K. Rowling","Stephenie Meyer","Suzanne Collins","Philip Pullman"],c:0,t:"Art & Culture",f:"J.K. Rowling a publié le premier tome en 1997."},
  {q:"Quel pays a inventé la pizza ?",a:["Italie","Grèce","Espagne","France"],c:0,t:"Gastronomie",f:"La pizza moderne est née à Naples au XIXe siècle."},
  {q:"Combien de secondes y a-t-il dans une heure ?",a:["3600","1800","7200","600"],c:0,t:"Sciences",f:"60 minutes × 60 secondes = 3 600 secondes."},
  {q:"Quel est le plus petit pays du monde ?",a:["Vatican","Monaco","Saint-Marin","Liechtenstein"],c:0,t:"Géographie",f:"Le Vatican couvre seulement 0,44 km²."},
  {q:"Qui a composé la Cinquième Symphonie ?",a:["Beethoven","Mozart","Bach","Chopin"],c:0,t:"Art & Culture",f:"Ludwig van Beethoven l'a composée entre 1804 et 1808."},
  {q:"Dans quel sport marque-t-on des touchdowns ?",a:["Football américain","Rugby","Football canadien","Crosse"],c:0,t:"Sport",f:"Le touchdown rapporte 6 points au football américain."},
  {q:"Quel est le fromage le plus consommé en France ?",a:["Emmental","Camembert","Comté","Brie"],c:0,t:"Gastronomie",f:"L'emmental est le fromage le plus vendu en France."},
  {q:"Quel animal figure sur les armoiries de l'Australie ?",a:["Kangourou","Koala","Dingo","Wombat"],c:0,t:"Géographie",f:"Le kangourou figure sur les armoiries australiennes."},
  {q:"En quelle année est entré en vigueur le traité de Maastricht ?",a:["1993","1989","1999","1957"],c:0,t:"Histoire",f:"Le traité de Maastricht est entré en vigueur le 1er novembre 1993."},
  {q:"Quelle est la plus haute montagne du monde ?",a:["Everest","K2","Kangchenjunga","Lhotse"],c:0,t:"Géographie",f:"L'Everest culmine à 8 849 mètres d'altitude."},
  {q:"Qui a découvert la pénicilline ?",a:["Alexander Fleming","Louis Pasteur","Marie Curie","Robert Koch"],c:0,t:"Sciences",f:"Alexander Fleming découvrit la pénicilline en 1928."},
  {q:"Dans quel pays est né Napoléon Bonaparte ?",a:["Corse","France","Italie","Espagne"],c:0,t:"Histoire",f:"Napoléon est né à Ajaccio, en Corse, le 15 août 1769."},
  {q:"Quel est le sport le plus pratiqué dans le monde ?",a:["Football","Basketball","Cricket","Tennis"],c:0,t:"Sport",f:"Le football compte plus de 4 milliards de fans dans le monde."},
  {q:"Quel acteur joue Iron Man dans l'univers Marvel ?",a:["Robert Downey Jr.","Chris Evans","Chris Hemsworth","Mark Ruffalo"],c:0,t:"Cinéma",f:"Robert Downey Jr. incarne Tony Stark depuis 2008."},
  {q:"Quelle est la boisson la plus consommée au monde après l'eau ?",a:["Thé","Café","Bière","Soda"],c:0,t:"Gastronomie",f:"Le thé est la boisson la plus bue dans le monde."},
  {q:"Combien de couleurs compte l'arc-en-ciel ?",a:["7","6","8","5"],c:0,t:"Sciences",f:"Rouge, orange, jaune, vert, bleu, indigo, violet : 7 couleurs."},
  {q:"Qui a écrit Roméo et Juliette ?",a:["Shakespeare","Molière","Victor Hugo","Dante"],c:0,t:"Art & Culture",f:"William Shakespeare a écrit cette tragédie vers 1594-1596."},
  {q:"Quelle est la langue la plus parlée dans le monde ?",a:["Anglais","Mandarin","Espagnol","Hindi"],c:0,t:"Géographie",f:"L'anglais est la langue la plus parlée au total (natifs + apprenants)."},
  {q:"En quelle année a été construite la Tour Eiffel ?",a:["1889","1900","1875","1910"],c:0,t:"Histoire",f:"La Tour Eiffel a été inaugurée le 31 mars 1889 pour l'Exposition universelle."},
];

function shuffle(arr){return arr.slice().sort(()=>Math.random()-.5);}

let theme='Tout', questions=[], qIdx=0, score=0, streak=0, total=0;
let timer=null, timeLeft=20, answered=false;
let deferredPrompt=null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').style.display = 'block';
});

function installApp(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; document.getElementById('installBanner').style.display='none'; }
}

function getQ(){
  let pool = theme==='Tout' ? ALL_Q : ALL_Q.filter(q=>q.t===theme);
  return shuffle(pool).slice(0,10);
}

function startQuiz(){
  questions=getQ(); qIdx=0; score=0; streak=0; total=0;
  updateStats();
  document.getElementById('endCard').style.display='none';
  document.getElementById('questionCard').style.display='block';
  loadQ();
}

function loadQ(){
  if(qIdx>=questions.length){endQuiz();return;}
  const q=questions[qIdx];
  answered=false;
  document.getElementById('qNum').textContent=`${qIdx+1} / ${questions.length}`;
  document.getElementById('qTheme').textContent=q.t;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('progressFill').style.width=`${(qIdx/questions.length)*100}%`;
  document.getElementById('progressText').textContent=`Question ${qIdx+1} sur ${questions.length}`;
  document.getElementById('feedback').style.display='none';
  document.getElementById('nextBtn').style.display='none';

  const shuffled = shuffle(q.a.map((a,i)=>({text:a,orig:i})));
  const correctIdx = shuffled.findIndex(a=>a.orig===q.c);

  document.getElementById('answers').innerHTML = shuffled.map((a,i)=>`
    <button class="ans-btn" id="a${i}" onclick="answer(${i},${correctIdx})">${a.text}</button>
  `).join('');

  startTimer(correctIdx);
}

function startTimer(ci){
  timeLeft=20; clearInterval(timer); updateTimer();
  timer=setInterval(()=>{
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){ clearInterval(timer); if(!answered) timeUp(ci); }
  },1000);
}

function updateTimer(){
  document.getElementById('timerNum').textContent=timeLeft;
  document.getElementById('timerFill').style.width=`${(timeLeft/20)*100}%`;
  const c = timeLeft>10?'#185FA5':timeLeft>5?'#BA7517':'#E24B4A';
  document.getElementById('timerFill').style.background=c;
}

function timeUp(ci){
  answered=true; streak=0; total++;
  disableAll();
  document.getElementById('a'+ci).classList.add('reveal');
  showFb(false,'⏱ Temps écoulé ! Bonne réponse : '+questions[qIdx].a[questions[qIdx].c]);
  updateStats();
  document.getElementById('nextBtn').style.display='block';
}

function answer(chosen, correct){
  if(answered) return;
  answered=true; clearInterval(timer); total++;
  disableAll();
  if(chosen===correct){
    document.getElementById('a'+chosen).classList.add('correct');
    score++; streak++;
    if(streak>=3) showStreak(`🔥 ${streak} d'affilée !`);
    showFb(true, streak>=3?`Parfait ! ${streak} bonnes réponses de suite !`:'Bonne réponse !');
  } else {
    document.getElementById('a'+chosen).classList.add('wrong');
    document.getElementById('a'+correct).classList.add('reveal');
    streak=0;
    showFb(false,'❌ '+( questions[qIdx].f||'Mauvaise réponse.'));
  }
  updateStats();
  document.getElementById('nextBtn').style.display='block';
}

function disableAll(){ document.querySelectorAll('.ans-btn').forEach(b=>b.disabled=true); }

function showFb(ok, msg){
  const fb=document.getElementById('feedback');
  fb.className='feedback '+(ok?'ok':'ko');
  fb.textContent=msg;
  fb.style.display='block';
}

function showStreak(msg){
  const t=document.getElementById('streakToast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function nextQuestion(){ qIdx++; loadQ(); }

function endQuiz(){
  clearInterval(timer);
  document.getElementById('questionCard').style.display='none';
  document.getElementById('endCard').style.display='block';
  document.getElementById('progressFill').style.width='100%';
  const pct=Math.round((score/questions.length)*100);
  document.getElementById('endScore').textContent=`${score}/${questions.length}`;
  const msgs=[[90,'Exceptionnel ! 🎯','Tu es incollable !'],[70,'Très bien ! 👏','Tu maîtrises le sujet.'],[50,'Pas mal ! 😊','Encore un effort !'],[0,'Continue ! 💪','La pratique mène à la perfection.']];
  const [,m,s]=msgs.find(([min])=>pct>=min);
  document.getElementById('endMsg').textContent=m;
  document.getElementById('endSub').textContent=s;
}

function restartQuiz(){ document.getElementById('endCard').style.display='none'; document.getElementById('questionCard').style.display='block'; startQuiz(); }

function shareScore(){
  const txt=`J'ai scoré ${score}/${questions.length} sur QuizInfini ! 🧠 Peux-tu faire mieux ? Joue gratuitement sur quizinfini.vercel.app`;
  if(navigator.share){ navigator.share({title:'QuizInfini',text:txt}); }
  else{ navigator.clipboard.writeText(txt).then(()=>{ alert('Score copié ! Colle-le où tu veux.'); }); }
}

function updateStats(){
  document.getElementById('scoreDisp').textContent=score;
  document.getElementById('streakDisp').textContent=streak;
  document.getElementById('totalDisp').textContent=total;
}

const bar=document.getElementById('themeBar');
bar.innerHTML=THEMES.map(t=>`<button class="theme-btn${t===theme?' active':''}" onclick="setTheme('${t}')">${t}</button>`).join('');
function setTheme(t){ theme=t; bar.querySelectorAll('.theme-btn').forEach((b,i)=>b.classList.toggle('active',THEMES[i]===t)); startQuiz(); }

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js')); }

startQuiz();
</script>
</body>
</html>
